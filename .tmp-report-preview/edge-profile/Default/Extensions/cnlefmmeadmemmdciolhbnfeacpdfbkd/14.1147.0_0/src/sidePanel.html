<!DOCTYPE html>
<html lang="en">

<head>
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta charset="UTF-8" />
  <title>SidePanel</title>
  <!-- stylesheet order matters, most generic, to most specific -->
  <link rel="stylesheet" href="css/Grammarly-fonts.styles.css" />
  <link rel="stylesheet" href="css/designSystem.styles.css" />
  <link rel="stylesheet" href="css/assistantUiKit.styles.css" />
  <link rel="stylesheet" href="css/staticSelectionAgentsCommon.styles.css" />
  <link rel="stylesheet" href="css/Grammarly-sidePanel.styles.css" />

  <!-- Setting the inline styles for the loading state of the side panel -->
  <style>
    body {
      /* setting the background color to colors that respect the system's preferred color scheme and correspond to the GDS tokens used in the Assistant UI*/
      @media (prefers-color-scheme: light) {
        background-color: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        background-color: #1c1c1c;
      }
    }

    /* The Llama Mac detection host contains the mount, so it must render as a block to avoid
       disturbing layout (unregistered custom elements default to display:inline). #side-panel
       is itself 100vh, so the host fills the panel. */
    grammarly-global-assistant-sidepanel {
      display: block;
    }

    /* The marker must stay in the accessibility tree for Llama Mac to find it, so it can't be
       display:none / visibility:hidden / aria-hidden. Give it a real (1px) box instead of
       collapsing to zero — Chrome prunes empty zero-size nodes from the AX tree. */
    #llama-sidepanel-marker {
      position: absolute;
      top: 0;
      left: 0;
      width: 1px;
      height: 1px;
      pointer-events: none;
    }
  </style>
</head>

<body class="gr-side-panel-wrapper">
  <!--
    Llama Mac hides its own notch when the focused side panel is detected. It resolves the focused
    element's AXWebArea and scans that web area's DIRECT AX children for one whose AXDescription is
    "grammarly-global-assistant-sidepanel" (see BrowserExtensionInterop.checkGlobalAssistantState).
    The role="presentation" host is AX-ignored, so the labeled group below is promoted to a direct
    web-area child — it does NOT need to wrap the mount, and must not, or screen readers announce
    the internal identifier around all panel content. Keep the label verbatim: Llama Mac matches
    the string exactly. Mirrors the notch marker in AssistantNotchAdapter.tsx.
  -->
  <!-- //NOSONAR Web:S6819: an image cannot host the marker. --><grammarly-global-assistant-sidepanel role="presentation">
    <!-- //NOSONAR Web:S6819: native group elements add incorrect semantics. --><div id="llama-sidepanel-marker" aria-label="grammarly-global-assistant-sidepanel" role="group" tabindex="-1"></div>
    <div id="side-panel"></div>
  </grammarly-global-assistant-sidepanel>
  <!-- deferring the parsing the script to unblock further DOM parsing and rendering the initial UI slightly earlier -->
  <script defer src="js/Grammarly-sidePanel.js"></script>
</body>

</html>
